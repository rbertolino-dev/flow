map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # DNS interno do Docker (127.0.0.11): mais rápido que 8.8.8.8 dentro do container.
    # valid=30s: re-resolve a cada 30s (Supabase usa Cloudflare Anycast — IPs mudam).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $supabase_host "ogeljmbhqxpfjbpnbwog.supabase.co";

    # Reusar sessão TLS entre requests ao upstream Supabase
    proxy_ssl_session_reuse on;

    # -------------------------------------------------------------------------
    # Proxy Supabase no mesmo domínio público (agilizeflow.com.br → este Nginx)
    # Resolve ERR_NAME_NOT_RESOLVED no cliente quando a rede não resolve *.supabase.co
    # Build deve usar: VITE_SUPABASE_URL=https://agilizeflow.com.br
    # -------------------------------------------------------------------------
    location /auth/v1/ {
        proxy_pass https://$supabase_host;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $supabase_host;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host $supabase_host;
        proxy_set_header Connection "";
        # Repasse explícito (evita 401 em Edge Functions / auth atrás do proxy agilizeflow.com.br)
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /rest/v1/ {
        proxy_pass https://$supabase_host;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $supabase_host;
        proxy_set_header Host $supabase_host;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /realtime/v1/ {
        proxy_pass https://$supabase_host;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $supabase_host;
        proxy_set_header Host $supabase_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /storage/v1/ {
        proxy_pass https://$supabase_host;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $supabase_host;
        proxy_set_header Host $supabase_host;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /functions/v1/ {
        proxy_pass https://$supabase_host;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $supabase_host;
        proxy_set_header Host $supabase_host;
        proxy_set_header Connection "";
        # Repasse Authorization + apikey (evolution-connection-state valida JWT na função; gateway pode ter verify_jwt off)
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /graphql/v1 {
        proxy_pass https://$supabase_host;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $supabase_host;
        proxy_set_header Host $supabase_host;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Configuração para React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML não pode ficar em cache para evitar servir bundles antigos
    # CRÍTICO: index.html sempre deve ser recarregado para pegar novos hashes de bundles
    #
    # ⚠️ Importante: usar 'always' para headers também em 304 (senão alguns browsers continuam usando HTML antigo)
    location = /index.html {
        etag off;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location ~* \.html$ {
        etag off;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # Arquivos estáticos em /assets/ - sempre têm hash do Vite, cache longo é seguro
    # Vite sempre gera hashes para ficheiros em /assets/, cache longo é seguro
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
    }

    # Arquivos estáticos fora de /assets/ - cache curto para evitar problemas
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # Cache curto para ficheiros sem hash (podem mudar sem aviso)
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Vary "Accept-Encoding";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Health check endpoint para zero-downtime deployment
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
