# Snippet: proxy para Edge Function create-evolution-instance (evita CORS)
# Incluir dentro do server {} do agilizeflow.com.br: include /etc/nginx/snippets/create-evolution-instance.conf;
# resolver + variável: evita falha do nginx -t / start se DNS do Supabase não resolver no boot
location /api/create-evolution-instance {
    resolver 127.0.0.53 1.1.1.1 valid=300s ipv6=off;
    set $supabase_create_evolution_host "ogeljmbhqxpfjbpnbwog.supabase.co";
    proxy_pass https://$supabase_create_evolution_host/functions/v1/create-evolution-instance;
    proxy_http_version 1.1;
    proxy_set_header Host ogeljmbhqxpfjbpnbwog.supabase.co;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $content_type;
    proxy_pass_request_body on;
    proxy_pass_request_headers on;
    proxy_ssl_server_name on;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
